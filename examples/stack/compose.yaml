# Sample two-service stack for stack-up.sh / stack-down.sh.
# The host ports below are fixed on purpose: stack-up.sh's generated override replaces them with
# the ticket's WEB_PORT and API_PORT, so several tickets run side by side.
services:
  web:
    image: busybox:1.36
    command: ["httpd", "-f", "-p", "80"]
    ports:
      - "80:80"
  api:
    image: busybox:1.36
    command: ["httpd", "-f", "-p", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - data:/data

volumes:
  data:
